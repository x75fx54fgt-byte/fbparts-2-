<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | F&B Parts</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .login-card h2 {
            color: #5e8877;
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #5e8877; }
        .btn-login {
            background-color: #5e8877;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover { background-color: #4a6d5f; }
        .btn-login:disabled { background-color: #999; cursor: not-allowed; }
        .back-link {
            display: block;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #5e8877; }
        #error-box {
            display: none;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: left;
            word-wrap: break-word;
        }
    </style>

    <!-- SCRIPT CAPTURADOR DE ERRORES GLOBALES (Por si el navegador bloquea algo en silencio) -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("Error Crítico del Navegador: " + message);
        };
        window.onunhandledrejection = function(event) {
            alert("Conexión Rechazada por Firebase/Navegador: " + (event.reason ? event.reason.message : "Desconocido"));
        };
    </script>
</head>
<body>

    <div class="login-card">
        <h2><i class="fas fa-lock"></i> ACCESO PERSONAL</h2>
        
        <div id="error-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label>Correo Autorizado</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="login-btn" class="btn-login">INGRESAR AL PANEL</button>
        </form>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const errorBox = document.getElementById('error-box');

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
                authDomain: "fb-parts-app.firebaseapp.com",
                projectId: "fb-parts-app",
                storageBucket: "fb-parts-app.firebasestorage.app",
                messagingSenderId: "21714159445",
                appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            // Redirección si ya está logueado
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.replace("admin.html");
                }
            });

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault(); 
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const btn = document.getElementById('login-btn');
                
                errorBox.style.display = 'none';
                btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> INGRESANDO...";
                btn.disabled = true;

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        window.location.href = "admin.html";
                    })
                    .catch((error) => {
                        btn.innerHTML = "INGRESAR AL PANEL";
                        btn.disabled = false;
                        errorBox.style.display = 'block';

                        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                            errorBox.innerHTML = "<strong>Error:</strong> Correo o contraseña incorrectos.";
                        } else if (error.code === 'auth/network-request-failed') {
                            errorBox.innerHTML = "<strong>Error de Red:</strong> Revisa tu conexión a internet o intenta cambiar 127.0.0.1 por localhost en la barra de direcciones.";
                        } else if (error.code === 'auth/operation-not-allowed') {
                            errorBox.innerHTML = "<strong>Error Crítico:</strong> El inicio de sesión por correo no está habilitado en tu consola de Firebase (Authentication > Sign-in method).";
                        } else {
                            errorBox.innerHTML = `<strong>Error:</strong> ${error.message} (${error.code})`;
                        }
                    });
            });

        } catch (err) {
            errorBox.style.display = 'block';
            errorBox.innerHTML = "<strong>Error de inicialización:</strong> " + err.message;
        }
    </script>
</body>
</html>
