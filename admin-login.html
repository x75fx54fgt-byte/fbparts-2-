<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Administrativo | F&B Parts</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- LIBRERÍA DE GOOGLE RECAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <link rel="stylesheet" href="styles.css">

    <style>
        body { background-color: #385723; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; margin: 0; }
        
        .login-container { max-width: 400px; margin: auto; padding: 0 20px; width: 100%; box-sizing: border-box; }
        .login-card { background: white; border: none; padding: 40px 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        
        .logo-container { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 15px; }
        .admin-logo { height: 65px; display: block; margin: 0 auto; }
        
        .login-card h3 { font-family: 'Oswald', sans-serif; color: #385723; font-size: 24px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #385723; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; }
        .form-group input { width: 100%; padding: 12px; padding-left: 40px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; outline: none; box-sizing: border-box; }
        .form-group input:focus { border-color: #385723; }
        
        .input-icon { position: absolute; left: 15px; top: 38px; color: #999; }

        .btn-action { background: #385723; color: white; border: none; padding: 12px; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; transition: background .2s; margin-top: 10px; letter-spacing: 1px; }
        .btn-action:hover { background: #2c441b; }
        .btn-action:disabled { background: #999; cursor: not-allowed; }
        
        .back-link { display: block; margin-top: 20px; color: #666; font-size: 13px; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: #385723; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png" alt="F&B Parts Admin" class="admin-logo">
            </div>
            <h3>Control Interno</h3>
            
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="email">Usuario (Correo Administrativo)</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="admin@fybparts.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña Maestra</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="*********" required>
                </div>

                <!-- WIDGET DE GOOGLE RECAPTCHA V2 -->
                <div style="display: flex; justify-content: center; margin-bottom: 15px;">
                    <div class="g-recaptcha" data-sitekey="6LeWTHQtAAAAAKDkgQNi7lPWC9Otct-PC4pOj392"></div>
                </div>

                <button type="submit" class="btn-action" id="btnLoginAdmin">
                    INGRESAR AL PANEL
                </button>
            </form>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver a la página pública</a>

            <div style="margin-top: 12px;">
                <button type="button" onclick="recuperarContrasenaAdmin()" style="background: none; border: none; color: #555; font-size: 12px; cursor: pointer; text-decoration: underline; transition: color 0.2s;" onmouseover="this.style.color='#385723'" onmouseout="this.style.color='#555'">
                    <i class="fas fa-key"></i> ¿Olvidaste tu contraseña maestra?
                </button>
            </div>

            <p id="error-message" style="color: red; margin-top: 15px; font-size: 14px; font-weight: bold;"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
            authDomain: "fb-parts-app.firebaseapp.com",
            projectId: "fb-parts-app",
            storageBucket: "fb-parts-app.firebasestorage.app",
            messagingSenderId: "21714159445",
            appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const adminLoginForm = document.getElementById('admin-login-form');
        const errorMessage = document.getElementById('error-message');
        const btnLoginAdmin = document.getElementById('btnLoginAdmin');

        // Función para validar si una sesión administrativa guardada es válida
        function verificarSesionAdminLocal() {
            try {
                const raw = localStorage.getItem('fyb_admin_session');
                if (!raw) return null;
                const s = JSON.parse(raw);
                const esAdmin = (s.email === 'fybinversiones.ccs@gmail.com' || s.email === 'admin@fybparts.com');
                const esReciente = (Date.now() - (s.timestamp || 0)) < (14 * 24 * 3600 * 1000);
                if (esAdmin && esReciente) return s;
            } catch(e) {}
            return null;
        }

        // 1. Detección inmediata de sesión administrativa local
        const sesionGuardada = verificarSesionAdminLocal();
        if (sesionGuardada) {
            errorMessage.innerText = "Sesión activa detectada. Entrando al panel...";
            errorMessage.style.color = "#385723";
            setTimeout(() => { window.location.href = "admin.html"; }, 300);
        }

        // 2. Detección de sesión activa en Firebase Auth SDK
        onAuthStateChanged(auth, (user) => {
            if (user && (user.email === 'fybinversiones.ccs@gmail.com' || user.email === 'admin@fybparts.com')) {
                try {
                    localStorage.setItem('fyb_admin_session', JSON.stringify({
                        email: user.email,
                        localId: user.uid,
                        timestamp: Date.now()
                    }));
                } catch(e) {}
                errorMessage.innerText = "Sesión autorizada detectada. Entrando al panel...";
                errorMessage.style.color = "#385723";
                setTimeout(() => { window.location.href = "admin.html"; }, 300);
            }
        });

        adminLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validar Captcha si está activo
            if (typeof grecaptcha !== 'undefined') {
                const recaptchaResponse = grecaptcha.getResponse();
                if (recaptchaResponse.length === 0) {
                    errorMessage.innerText = "⚠️ Demuestra que no eres un robot marcando la casilla.";
                    errorMessage.style.color = "red";
                    return;
                }
            }

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            errorMessage.innerText = "Verificando credenciales...";
            errorMessage.style.color = "#385723";
            btnLoginAdmin.disabled = true;
            btnLoginAdmin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...';

            try {
                // =========================================================================
                // ⚡ AUTENTICACIÓN DIRECTA VÍA REST (GOOGLE IDENTITY TOOLKIT)
                // Inmune a bloqueos de iframes, partición de cookies y latencia de SDK
                // =========================================================================
                const restUrl = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${firebaseConfig.apiKey}`;
                
                const abortCtrl = new AbortController();
                const timeoutId = setTimeout(() => abortCtrl.abort(), 9000);

                const resp = await fetch(restUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        returnSecureToken: true
                    }),
                    signal: abortCtrl.signal
                });
                clearTimeout(timeoutId);

                const data = await resp.json();

                if (!resp.ok) {
                    const errCode = data?.error?.message || '';
                    console.warn("Respuesta de autenticación:", errCode);
                    if (errCode.includes('INVALID_PASSWORD') || errCode.includes('INVALID_LOGIN_CREDENTIALS') || errCode.includes('EMAIL_NOT_FOUND')) {
                        throw new Error("⚠️ Correo o contraseña maestra incorrectos.");
                    } else if (errCode.includes('TOO_MANY_ATTEMPTS_TRY_LATER')) {
                        throw new Error("⚠️ Demasiados intentos fallidos. Espera unos minutos antes de reintentar.");
                    } else if (errCode.includes('USER_DISABLED')) {
                        throw new Error("⛔ Esta cuenta administrativa ha sido inhabilitada.");
                    } else {
                        throw new Error("⚠️ Error al autenticar credenciales (" + (errCode || "Respuesta inválida") + ").");
                    }
                }

                // Verificar autorización de administrador
                const emailAutenticado = (data.email || email).toLowerCase().trim();
                if (emailAutenticado !== 'fybinversiones.ccs@gmail.com' && emailAutenticado !== 'admin@fybparts.com') {
                    throw new Error("⛔ Acceso denegado: Esta cuenta no posee permisos de administrador.");
                }

                // Guardar credenciales de sesión administrativa en localStorage (permanente y confiable)
                localStorage.setItem('fyb_admin_session', JSON.stringify({
                    email: emailAutenticado,
                    localId: data.localId,
                    idToken: data.idToken,
                    refreshToken: data.refreshToken,
                    timestamp: Date.now()
                }));

                // Sincronizar el SDK de Firebase Auth para que Firestore reconozca la sesión del usuario
                try {
                    await Promise.race([
                        signInWithEmailAndPassword(auth, email, password),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('SDK_SYNC_TIMEOUT')), 3500))
                    ]);
                } catch (sdkErr) {
                    console.warn("Sincronización SDK diferida:", sdkErr.message);
                }

                errorMessage.innerText = "✅ ¡Acceso autorizado! Entrando al panel...";
                errorMessage.style.color = "#28a745";
                btnLoginAdmin.innerHTML = '<i class="fas fa-check"></i> Redirigiendo...';

                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 400);

            } catch (error) {
                console.error("Error en login administrativo:", error);
                let msg = error.message || "Error de conexión con el servicio de autenticación.";
                if (error.name === 'AbortError') {
                    msg = "⚠️ Tiempo de espera agotado. Revisa tu conexión a internet e intenta de nuevo.";
                }
                
                errorMessage.style.color = "red";
                errorMessage.innerText = msg;
                btnLoginAdmin.disabled = false;
                btnLoginAdmin.innerHTML = 'INGRESAR AL PANEL';
                if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
            }
        });

        // Función auxiliar para recuperación de contraseña administrativa
        window.recuperarContrasenaAdmin = async function() {
            const email = document.getElementById('email').value.trim().toLowerCase() || 'fybinversiones.ccs@gmail.com';
            if (!confirm(`¿Deseas enviar un enlace de restablecimiento de contraseña a: ${email}?`)) return;

            try {
                await sendPasswordResetEmail(auth, email);
                alert(`✅ Se ha enviado un correo a ${email} con las instrucciones para restablecer tu contraseña maestra.`);
            } catch (err) {
                alert(`Error al enviar correo de recuperación: ${err.message}`);
            }
        };
    </script>
</body>
</html>
