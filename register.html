<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta | F&B Parts</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">

    <style>
        .register-container { max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .register-card { background: white; border: 1px solid #eee; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,.05); text-align: center; }
        .register-card h3 { font-family: 'Oswald', sans-serif; color: var(--green); font-size: 28px; margin-bottom: 20px; border-bottom: 2px solid var(--green); padding-bottom: 10px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; text-align: left; position: relative; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--green); }
        .form-group textarea { resize: vertical; height: 70px; }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 36px;
            cursor: pointer;
            color: #777;
            font-size: 16px;
        }
        .toggle-password:hover { color: var(--green); }

        .btn-action { background: var(--green); color: white; border: none; padding: 12px; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; transition: background .2s; margin-top: 10px; }
        .btn-action:hover { background: var(--green-dark); }
        .btn-action:disabled { background: #999; cursor: not-allowed; } /* Estilo para botón deshabilitado */
        
        .btn-secondary { background: white; color: var(--green); border: 2px solid var(--green); padding: 10px; font-family: 'Oswald', sans-serif; font-size: 15px; cursor: pointer; border-radius: 4px; width: 100%; transition: all .2s; margin-top: 10px; text-decoration: none; display: inline-block; }
        .btn-secondary:hover { background: #f0f4f1; }

        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="topbar">
        <h2>PORTAL DE CLIENTES F&B PARTS</h2>
        <span>REGISTRO DE DATOS Y NUEVA CUENTA</span>
    </div>

    <header style="background: white; border-bottom: 1px solid #eee;">
        <div class="container header-wrap" style="padding: 15px 20px;">
            <a class="logo" href="index.html">
                <img src="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png" alt="LOGO F&B PARTS" style="height: 60px;">
            </a>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="login.html">Iniciar Sesión</a>
            </nav>

            <div class="header-right">
                <a class="call-btn" href="login.html" style="background: #333; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px;">
                    <i class="fas fa-arrow-left"></i> VOLVER 
                </a>
            </div>
        </div>
    </header>

    <div class="register-container">
        <div class="register-card">
            <h3><i class="fas fa-user-plus"></i> REGISTRO DE CLIENTE</h3>
            
            <form id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej: Carlos" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" placeholder="Ej: Mendoza" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cedula">Cédula / RIF</label>
                        <input type="text" id="cedula" placeholder="Ej: V-12345678" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono / WhatsApp</label>
                        <input type="tel" id="telefono" placeholder="Ej: 0412-1234567" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <div class="form-group">
                    <label for="ubicacion">Dirección de Envío / Ubicación</label>
                    <textarea id="ubicacion" placeholder="Ciudad, Urbanización, Calle o Punto de Referencia..." required></textarea>
                </div>

                <button type="submit" class="btn-action" id="btnRegister">
                    CREAR CUENTA
                </button>
            </form>

            <button class="btn-secondary" onclick="window.location.href='login.html'">
                YA TENGO CUENTA (INICIAR SESIÓN)
            </button>

            <p id="error-message" style="color: red; margin-top: 15px; font-size: 14px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Lógica de Firebase Auth y Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
            authDomain: "fb-parts-app.firebaseapp.com",
            projectId: "fb-parts-app",
            storageBucket: "fb-parts-app.firebasestorage.app",
            messagingSenderId: "21714159445",
            appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Control del botón del ojito
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Registro de usuario y guardado de perfil en Firestore
        const registerForm = document.getElementById('register-form');
        const errorMessage = document.getElementById('error-message');
        const btnRegister = document.getElementById('btnRegister');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const cedula = document.getElementById('cedula').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const email = document.getElementById('email').value.toLowerCase().trim();
            const password = passwordInput.value;
            const ubicacion = document.getElementById('ubicacion').value.trim();

            errorMessage.innerText = "Registrando tus datos...";
            errorMessage.style.color = "green";
            btnRegister.disabled = true; // Bloquea el botón para no repetir el proceso

            try {
                // 1. Creamos la cuenta en Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Guardamos la información detallada en la colección "usuarios"
                await setDoc(doc(db, "usuarios", user.uid), {
                    uid: user.uid,
                    nombre: nombre,
                    apellido: apellido,
                    cedula: cedula,
                    telefono: telefono,
                    email: email,
                    ubicacion: ubicacion,
                    fechaRegistro: new Date().toLocaleString("es-VE")
                });

                alert("¡Cuenta registrada con éxito!");

                // === INICIO DE REDIRECCIÓN INTELIGENTE ===
                const carritoMemoria = localStorage.getItem('carritoFB');
                let carrito = [];
                
                if (carritoMemoria) {
                    carrito = JSON.parse(carritoMemoria);
                }

                // Si el cliente estaba comprando, lo devolvemos al catálogo
                if (carrito.length > 0) {
                    window.location.href = "tienda.html";
                } else {
                // Si entró a registrarse de la nada, va a su perfil
                    window.location.href = "mi-cuenta.html";
                }

            } catch (error) {
                console.error(error);
                errorMessage.style.color = "red";
                btnRegister.disabled = false; // Reactiva el botón si hay error
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage.innerText = "Este correo ya está registrado.";
                } else if (error.code === 'auth/weak-password') {
                    errorMessage.innerText = "La contraseña debe tener al menos 6 caracteres.";
                } else {
                    errorMessage.innerText = "Error al registrarse. Intenta nuevamente.";
                }
            }
        });
    </script>
</body>
</html>
