<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Pedidos y Envíos | F&B Parts</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">

    <style>
        .container-orders { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .orders-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--green); padding-bottom: 15px; }
        .orders-header h2 { color: var(--green); font-family: 'Oswald', sans-serif; font-size: 30px; margin: 0; }
        
        .order-card { background: white; border: 1px solid #eee; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.03); }
        .order-card-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; font-size: 14px; color: #666; }
        
        .order-products { margin-bottom: 15px; }
        .order-item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; font-size: 15px; }
        
        .order-shipping-box { background: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid var(--green); font-size: 14px; margin-top: 10px; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; font-size: 18px; font-weight: bold; }
        
        .btn-logout { background: #d9534f; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-family: 'Oswald', sans-serif; cursor: pointer; font-size: 14px; }
        .btn-logout:hover { background: #c9302c; }
    
        /* =========================================================
           🚀 RESPONSIVE DESIGN TOTAL: MODALS & GENERAL GRIDS
           ========================================================= */
        @media (max-width: 768px) {
            .modal-content { width: 95% !important; padding: 15px !important; margin: 10px auto !important; }
            div[style*="display: grid"] { grid-template-columns: 1fr !important; }
        }

        /* =========================================================
           🚀 RESPONSIVE DESIGN TOTAL: TABLAS
           ========================================================= */
        @media (max-width: 768px) {
            .data-table, table { display: block !important; overflow-x: auto !important; white-space: nowrap !important; width: 100% !important; -webkit-overflow-scrolling: touch; }
        }
</style>
</head>
<body>

    <div class="topbar">
        <h2>PORTAL DE CLIENTES</h2>
        <span>SEGUIMIENTO DE PEDIDOS Y ENVIOS</span>
    </div>

        <header style="background: white; border-bottom: 1px solid #eee; position: relative;">
        <div class="container header-wrap" style="padding: 15px 20px; max-width: 1350px; display: flex; justify-content: space-between; align-items: center;">
            <a class="logo" href="index.html" style="display: flex; align-items: center;">
                <img src="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png" alt="Logotipo F&B PARTS" decoding="async" style="height: 60px;">
            </a>
            
            <nav id="nav-principal">
                <a href="index.html" onclick="toggleMenuMobile()">Inicio</a>
                <a href="tienda.html" onclick="toggleMenuMobile()">Repuestos</a>
                <a href="quienes-somos.html" onclick="toggleMenuMobile()">Quienes somos</a>
                <a href="index.html#mercadolibre" onclick="toggleMenuMobile()">Mercado Libre</a>
                <a href="index.html#contacto" onclick="toggleMenuMobile()">Contacto</a>
                <a href="login.html" id="nav-cuenta-btn" style="color: var(--green); font-weight: bold; border-bottom: 2px solid var(--green); padding-bottom: 5px;"><i class="fas fa-user"></i> Mi Cuenta</a>
            </nav>

            <button class="mobile-menu" aria-label="Menú" onclick="toggleMenuMobile()" style="margin: 0; margin-left: auto;">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="container-orders">
        <div class="orders-header">
            <h2><i class="fas fa-box"></i> Historial de Compras y Envíos</h2>
            <span id="user-email-display" style="font-weight: bold; color: #555;">Cargando usuario...</span>
        </div>

        <div id="client-orders-list">
            <div style="text-align: center; color: #777; padding: 40px;">Buscando tus pedidos en la nube...</div>
        </div>
    </div>

    <!-- Lógica de Seguridad y Consulta de Historial del Cliente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { SecuritySanitizer } from "./security-utils.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
            authDomain: "fb-parts-app.firebaseapp.com",
            projectId: "fb-parts-app",
            storageBucket: "fb-parts-app.firebasestorage.app",
            messagingSenderId: "21714159445",
            appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const emailDisplay = document.getElementById('user-email-display');
        const ordersListContainer = document.getElementById('client-orders-list');

        // Validar si el cliente está logueado
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // Si no ha iniciado sesión, lo mandamos al login de la tienda
                window.location.href = "login.html";
            } else {
                emailDisplay.innerText = SecuritySanitizer.escapeHtml(user.email || '');
                await cargarPedidosCliente(user.email);
            }
        });

        // Botón para cerrar sesión
        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });

        // Buscar solo los pedidos correspondientes a este correo
        async function cargarPedidosCliente(userEmail) {
            try {
                const cleanEmail = (userEmail || '').toLowerCase().trim();
                const q = query(collection(db, "pedidos"), where("email", "==", cleanEmail));
                const querySnapshot = await getDocs(q);
                let misPedidos = [];

                querySnapshot.forEach((docSnap) => {
                    misPedidos.push(docSnap.data());
                });

                if (misPedidos.length === 0) {
                    ordersListContainer.innerHTML = `
                        <div style="text-align: center; color: #777; padding: 40px; background: white; border-radius: 8px; border: 1px solid #eee;">
                            <i class="fas fa-shopping-cart" style="font-size: 40px; color: #ccc; margin-bottom: 10px;"></i>
                            <p>Aún no tienes pedidos registrados con este correo (${SecuritySanitizer.escapeHtml(userEmail)}).</p>
                            <a href="tienda.html" style="color: var(--green); font-weight: bold; text-decoration: underline;">Ir a la tienda a comprar repuestos</a>
                        </div>`;
                    return;
                }

                ordersListContainer.innerHTML = '';
                
                misPedidos.forEach((pedido) => {
                    let productosHTML = '';
                    if (pedido.productos && Array.isArray(pedido.productos)) {
                        pedido.productos.forEach(p => {
                            const cant = SecuritySanitizer.sanitizeInt(p.cantidad, 1);
                            const nom = SecuritySanitizer.escapeHtml(p.nombre || 'Producto');
                            const pr = SecuritySanitizer.sanitizeAmount(p.precio);
                            productosHTML += `
                                <div class="order-item-row">
                                    <span>${cant}x ${nom}</span>
                                    <span>$${(pr * cant).toFixed(2)}</span>
                                </div>`;
                        });
                    }

                    let envioMetodo = SecuritySanitizer.escapeHtml(pedido.envio || "Motorizado Caracas");
                    let trackingInfo = SecuritySanitizer.escapeHtml(pedido.tracking || "En preparación");
                    let estado = SecuritySanitizer.escapeHtml(pedido.estado || "Procesando");
                    let fecha = SecuritySanitizer.escapeHtml(pedido.fecha || "N/D");
                    let total = SecuritySanitizer.sanitizeAmount(pedido.total);

                    ordersListContainer.innerHTML += `
                        <div class="order-card">
                            <div class="order-card-header">
                                <span><strong>Fecha:</strong> ${fecha}</span>
                                <span style="background: #e8f4fd; color: #1d6fa5; padding: 3px 8px; border-radius: 4px; font-weight: bold;">${estado}</span>
                            </div>
                            
                            <div class="order-products">
                                ${productosHTML}
                            </div>

                            <div class="order-shipping-box">
                                <div><i class="fas fa-shipping-fast" style="color: var(--green);"></i> <strong>Método de Envío:</strong> ${envioMetodo}</div>
                                <div style="margin-top: 4px; color: #333;"><i class="fas fa-info-circle"></i> <strong>Estatus / Nro. de Guía:</strong> ${trackingInfo}</div>
                            </div>

                            <div class="order-footer">
                                <span style="font-size: 15px; color: #555;">Total pagado:</span>
                                <span style="color: var(--green);">$${total.toFixed(2)}</span>
                            </div>
                        </div>`;
                });

            } catch (error) {
                console.error("Error al cargar historial del cliente: ", error);
                ordersListContainer.innerHTML = `<p style="text-align: center; color: red;">Error al sincronizar tus pedidos.</p>`;
            }
        }
    </script>

<script>
    function toggleMenuMobile() {
        const nav = document.getElementById('nav-principal');
        if(nav) nav.classList.toggle('menu-activo');
    }
</script>
</body>
</html>
