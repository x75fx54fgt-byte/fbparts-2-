<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Cuenta | F&B Parts</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">

    <style>
        .login-container { max-width: 450px; margin: 60px auto; padding: 0 20px; }
        .login-card { background: white; border: 1px solid #eee; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,.05); text-align: center; }
        .login-card h3 { font-family: 'Oswald', sans-serif; color: var(--green); font-size: 28px; margin-bottom: 25px; border-bottom: 2px solid var(--green); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #333; }
        .form-group input { width: 100%; padding: 12px; padding-right: 45px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }

        /* Estilo para el ícono del ojito */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: #777;
            font-size: 18px;
        }
        .toggle-password:hover { color: var(--green); }

        .btn-action { background: var(--green); color: white; border: none; padding: 12px; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; transition: background .2s; margin-top: 10px; }
        .btn-action:hover { background: var(--green-dark); }
        
        .btn-secondary { background: white; color: var(--green); border: 2px solid var(--green); padding: 12px; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; border-radius: 4px; width: 100%; transition: all .2s; margin-top: 10px; text-decoration: none; display: inline-block; }
        .btn-secondary:hover { background: #f0f4f1; }
    </style>
</head>
<body>

    <div class="topbar">
        <h2>PORTAL DE CLIENTES F&B PARTS</h2>
        <span>ACCESO A TU CUENTA Y PEDIDOS</span>
    </div>

    <header>
        <div class="container header-wrap">
            <a class="logo" href="index.html">
                <img src="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png" alt="LOGO F&B PARTS">
            </a>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="index.html#contacto">Contacto</a>
            </nav>

            <div class="header-right">
                <a class="call-btn" href="index.html">
                    <i class="fas fa-arrow-left"></i> VOLVER 
                </a>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h3><i class="fas fa-user-lock"></i> MI CUENTA</h3>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                    <!-- Aquí está el ícono del ojito interactivo -->
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <button type="submit" class="btn-action" id="btnLogin">
                    INICIAR SESIÓN
                </button>
            </form>

            <button class="btn-secondary" onclick="window.location.href='register.html'">
                CREAR CUENTA NUEVA
            </button>

            <p id="error-message" style="color: red; margin-top: 15px; font-size: 14px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Lógica de Firebase y el botón del ojito -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
            authDomain: "fb-parts-app.firebaseapp.com",
            projectId: "fb-parts-app",
            storageBucket: "fb-parts-app.firebasestorage.app",
            messagingSenderId: "21714159445",
            appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Lógica para el botón del ojito (Mostrar / Ocultar contraseña)
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // Cambiar el tipo de input entre password y text
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Cambiar el ícono del ojo (ojo abierto / ojo tachado)
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Lógica de inicio de sesión
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            errorMessage.innerText = "Iniciando sesión...";
            errorMessage.style.color = "green";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Si entra bien, lo mandamos directo al portal de su cuenta y envíos
                window.location.href = "mi-cuenta.html";
            } catch (error) {
                console.error(error);
                errorMessage.style.color = "red";
                errorMessage.innerText = "Correo o contraseña incorrectos.";
            }
        });
    </script>
</body>
</html>
