<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Etiquetas SEO dinámicas (Se actualizarán por JS) -->
    <title>Cargando repuesto... | F&B Parts</title>
    <meta id="meta-description" name="description" content="Detalles del repuesto automotriz en F&B Parts.">
    
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        body { background-color: #f8f8f8; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        
        .product-page-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
        }

        .product-wrapper {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            border: 1px solid #eee;
        }

        @media (max-width: 768px) {
            .product-wrapper { grid-template-columns: 1fr; padding: 20px; }
            .product-page-container { margin: 20px auto; }
        }

        .img-magnifier-container { position: relative; width: 100%; background: #f9f9f9; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 20px; aspect-ratio: 1/1; }
        .img-magnifier-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .product-details { display: flex; flex-direction: column; }
        .product-condition { font-size: 13px; color: #666; margin-bottom: 10px; }
        .product-name { font-family: 'Oswald', sans-serif; font-size: 28px; color: #333; margin: 0 0 15px 0; line-height: 1.2; }
        .product-price { font-family: 'Oswald', sans-serif; font-size: 36px; color: #385723; margin: 0 0 20px 0; }
        
        .product-info-list { margin-bottom: 15px; padding: 0; list-style: none; color: #555; font-size: 15px; }
        .product-info-list li { margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
        .product-info-list i { color: #385723; width: 20px; text-align: center; }

        .btn-add-cart-large { background: #385723; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-bottom: 12px; transition: 0.2s; font-family: 'Oswald', sans-serif; letter-spacing: 1px; }
        .btn-add-cart-large:hover { background: #2c441b; }
        
        .btn-ml-large { background: #ffe600; color: #333; padding: 15px; border-radius: 6px; text-align: center; text-decoration: none; font-weight: bold; display: block; width: 100%; transition: 0.2s; box-sizing: border-box; font-size: 16px; font-family: 'Oswald', sans-serif; letter-spacing: 1px; }
        .btn-ml-large:hover { background: #ffd000; }

        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #385723; text-decoration: none; font-weight: bold; margin-bottom: 20px; font-size: 15px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header style="background: white; border-bottom: 1px solid #eee;">
        <div class="container header-wrap" style="padding: 15px 20px; max-width: 1350px;">
            <a class="logo" href="index.html">
                <img src="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png" alt="Logotipo F&B PARTS" style="height: 60px;">
            </a>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="tienda.html" style="color: #385723; font-weight: bold;">Tienda</a>
                <a href="tienda.html" style="color: var(--green); font-weight: bold;"><i class="fas fa-shopping-cart"></i> Ver Carrito</a>
            </nav>
        </div>
    </header>

    <div class="product-page-container">
        <a href="tienda.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al catálogo</a>
        
        <div id="product-content" class="product-wrapper">
            <div style="grid-column: 1/-1; text-align:center; padding: 50px; color:#666;">
                <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i><br>
                Cargando información del repuesto...
            </div>
        </div>
    </div>

    <footer style="background-color: #000; color: #fff; text-align: center; padding: 25px 0; margin-top: auto;">
        <p class="oswald" style="margin: 0; font-size: 16px; letter-spacing: 1px;">&copy;<span id="year-footer">2026</span> por F&B PARTS.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
            authDomain: "fb-parts-app.firebaseapp.com",
            projectId: "fb-parts-app",
            storageBucket: "fb-parts-app.firebasestorage.app",
            messagingSenderId: "21714159445",
            appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        window.carrito = JSON.parse(localStorage.getItem('carritoFB')) || [];

        window.agregarAlCarritoDesdeProducto = function(id, nombre, precio) {
            const item = window.carrito.find(i => i.id === id);
            if(item) item.cantidad++;
            else window.carrito.push({ id, nombre, precio, cantidad: 1 });
            localStorage.setItem('carritoFB', JSON.stringify(window.carrito));
            
            alert("¡Repuesto agregado al carrito con éxito!");
            window.location.href = "tienda.html";
        };

        async function cargarProducto() {
            if (!productId) {
                document.getElementById('product-content').innerHTML = `<h2 style="grid-column:1/-1; text-align:center; color:red;">Error: No se especificó ningún repuesto.</h2>`;
                return;
            }

            try {
                const docRef = doc(db, "productos", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const prod = docSnap.data();
                    const safeName = prod.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    document.title = `${prod.nombre} | F&B Parts Caracas`;
                    document.getElementById('meta-description').content = `Compra ${prod.nombre} al mejor precio en Caracas. Repuestos originales para tu vehículo. Delivery disponible.`;

                    let botonML = "";
                    if(prod.ml_id && prod.ml_id.trim() !== "") {
                        let idML = prod.ml_id.trim();
                        if (idML.startsWith("MLV") && !idML.startsWith("MLV-")) idML = idML.replace("MLV", "MLV-");
                        botonML = `<a href="https://articulo.mercadolibre.com.ve/${idML}" target="_blank" class="btn-ml-large"><i class="fas fa-handshake"></i> Comprar en Mercado Libre</a>`;
                    }

                    // LÓGICA DEL NÚMERO DE PARTE
                    let textoCondicion = "Original / OEM";
                    if (prod.numero_parte && prod.numero_parte.trim() !== "") {
                        textoCondicion = `<span style="color: #385723; font-weight: bold;">Nro. Parte: ${prod.numero_parte}</span>`;
                    }

                    // LÓGICA DE LA DESCRIPCIÓN DETALLADA
                    let bloqueDescripcion = "";
                    if (prod.descripcion && prod.descripcion.trim() !== "") {
                        let descFormateada = prod.descripcion.replace(/\n/g, '<br>');
                        bloqueDescripcion = `
                            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                                <h4 style="margin: 0 0 10px 0; font-family: 'Oswald', sans-serif; color: #333;">Descripción del Repuesto</h4>
                                <p style="font-size: 14px; color: #555; line-height: 1.6; margin: 0;">${descFormateada}</p>
                            </div>
                        `;
                    }

                    document.getElementById('product-content').innerHTML = `
                        <div class="img-magnifier-container">
                            <img src="${prod.imagen}" alt="${prod.nombre} en Caracas">
                        </div>
                        <div class="product-details">
                            <div class="product-condition">Nuevo | ${textoCondicion}</div>
                            <h1 class="product-name">${prod.nombre}</h1>
                            <div class="product-price">$${Number(prod.precio).toFixed(2)}</div>
                            
                            <ul class="product-info-list">
                                <li><i class="fas fa-truck"></i> Delivery disponible en Caracas</li>
                                <li><i class="fas fa-box"></i> Envíos nacionales por MRW, Zoom y Tealca</li>
                                <li><i class="fas fa-shield-alt"></i> Garantía por defecto de fábrica</li>
                            </ul>

                            ${bloqueDescripcion}

                            <div style="margin-top: auto; padding-top: 20px;">
                                <button type="button" class="btn-add-cart-large" onclick="agregarAlCarritoDesdeProducto('${docSnap.id}', '${safeName}', ${prod.precio})">
                                    <i class="fas fa-cart-plus"></i> Añadir al carrito
                                </button>
                                ${botonML}
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('product-content').innerHTML = `<h2 style="grid-column:1/-1; text-align:center; color:red;">Repuesto no encontrado.</h2>`;
                }
            } catch (error) {
                console.error("Error cargando el producto:", error);
                document.getElementById('product-content').innerHTML = `<h2 style="grid-column:1/-1; text-align:center; color:red;">Error de conexión. Intente más tarde.</h2>`;
            }
        }

        window.addEventListener('DOMContentLoaded', cargarProducto);
    </script>
</body>
</html>
