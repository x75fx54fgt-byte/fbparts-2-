<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Básico y Canónico -->
    <title id="seo-title">Detalle del Repuesto | F&B Parts</title>
    <meta id="seo-desc" name="description" content="Encuentra repuestos originales y autopartes de alta calidad en Caracas, Venezuela.">
    <link id="seo-canonical" rel="canonical" href="https://www.fybparts.com/producto.html">

    <!-- Open Graph (Dinámico para Redes Sociales y Buscadores) -->
    <meta property="og:title" content="Catálogo de Repuestos | F&B Parts" id="og-title">
    <meta property="og:description" content="Encuentra repuestos originales y accesorios para tu vehículo en Caracas." id="og-desc">
    <meta property="og:image" content="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png" id="og-image">
    <meta property="og:type" content="product">
    <meta property="og:url" content="https://www.fybparts.com/producto.html" id="og-url">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8f8f8; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        
        /* Estilos para las Migas de Pan (Breadcrumbs) */
        .breadcrumb-nav { max-width: 1100px; margin: 20px auto 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box; font-size: 14px; color: #666; }
        .breadcrumb-nav a { color: #385723; text-decoration: none; font-weight: bold; }
        .breadcrumb-nav a:hover { text-decoration: underline; }
        .breadcrumb-nav span { color: #555; }

        .product-container { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; box-sizing: border-box; background: white; padding: 40px; border-radius: 8px; border: 1px solid #eee; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
        .product-img-box { width: 100%; height: 400px; background: #fff; display: flex; align-items: center; justify-content: center; border: 1px solid #eee; border-radius: 6px; overflow: hidden; }
        .product-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .product-details h1 { font-family: 'Oswald', sans-serif; color: #385723; font-size: 28px; margin-top: 0; margin-bottom: 15px; }
        .product-price { font-size: 26px; color: #385723; font-weight: bold; font-family: 'Oswald', sans-serif; margin-bottom: 20px; }
        .product-meta { font-size: 14px; color: #555; margin-bottom: 15px; line-height: 1.6; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; }
        .btn-add-cart-large { background: #385723; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; transition: background 0.2s; font-family: 'Oswald', sans-serif; text-transform: uppercase; margin-top: 20px; }
        .btn-add-cart-large:hover { background: #2c441b; }
        .btn-ml-large { background: #ffe600; color: #333; padding: 12px; border-radius: 6px; text-align: center; text-decoration: none; font-weight: bold; display: block; width: 100%; transition: 0.2s; box-sizing: border-box; font-size: 15px; font-family: 'Oswald', sans-serif; margin-top: 10px; }
        
        /* Estilos para la sección de Productos Relacionados */
        .related-section { max-width: 1100px; margin: 0 auto 50px auto; padding: 0 20px; width: 100%; box-sizing: border-box; }
        .related-section h3 { font-family: 'Oswald', sans-serif; color: #385723; font-size: 22px; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .related-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        @media (max-width: 900px) { 
            .product-container { grid-template-columns: 1fr; padding: 20px; } 
            .product-img-box { height: 280px; } 
            .related-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <p style="margin:0; font-weight: bold; font-size: 14px; letter-spacing: 1px;">DELIVERY GRATIS EN CARACAS</p><span>(CIERTAS CONDICIONES APLICAN)</span>
    </div>

    <header style="background: white; border-bottom: 1px solid #eee;">
        <div class="container header-wrap" style="padding: 15px 20px; max-width: 1350px;">
            <a class="logo" href="index.html">
                <img src="https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png" alt="Logotipo F&B PARTS" style="height: 60px;">
            </a>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="tienda.html" style="color: #385723; font-weight: bold;">Tienda</a>
                <a href="login.html" id="nav-cuenta-btn" style="color: var(--green); font-weight: bold;"><i class="fas fa-user"></i> Mi Cuenta</a>
            </nav>
        </div>
    </header>

    <!-- 🚀 RUTA VISUAL DE MIGAS DE PAN (BREADCRUMBS) -->
    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
        <a href="index.html">Inicio</a> › 
        <a href="tienda.html">Tienda</a> › 
        <span id="breadcrumb-current">Cargando...</span>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DEL PRODUCTO -->
    <div class="product-container" id="product-details-container">
        <div style="text-align: center; grid-column: 1/-1; padding: 50px; color: #666;">
            <i class="fas fa-spinner fa-spin" style="font-size: 30px;"></i><br>Cargando información del repuesto...
        </div>
    </div>

    <!-- SECCIÓN DE PRODUCTOS RELACIONADOS INTELIGENTES -->
    <section class="related-section">
        <h3>También te puede interesar</h3>
        <div class="related-grid" id="related-products-grid">
            <!-- Se cargan dinámicamente -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer style="background-color: #000; color: #fff; text-align: center; padding: 25px 0; margin-top: auto;">
        <p class="oswald" style="margin: 0; font-size: 16px; letter-spacing: 1px;">&copy;<span id="year-footer">2026</span> por F&B PARTS.</p>
        <script> document.getElementById('year-footer').textContent = new Date().getFullYear(); </script>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9bOFYHL68yoksRU9G2dwLSxCfMrSW-ew",
            authDomain: "fb-parts-app.firebaseapp.com",
            projectId: "fb-parts-app",
            storageBucket: "fb-parts-app.firebasestorage.app",
            messagingSenderId: "21714159445",
            appId: "1:21714159445:web:8f4946cd1c98d9b95dd1dc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            const navBtn = document.getElementById('nav-cuenta-btn');
            if (user) {
                navBtn.href = "mi-cuenta.html";
                navBtn.innerHTML = `<i class="fas fa-user-check"></i> Mi Cuenta`;
            } else {
                navBtn.href = "login.html";
                navBtn.innerHTML = `<i class="fas fa-user"></i> Iniciar Sesión`;
            }
        });

        async function cargarDetalleProducto() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            const container = document.getElementById('product-details-container');

            if (!productId) {
                container.innerHTML = '<div style="text-align:center; grid-column: 1/-1; padding: 40px;">Repuesto no especificado. <a href="tienda.html" style="color:#385723; font-weight:bold;">Volver a la tienda</a></div>';
                return;
            }

            try {
                const docRef = doc(db, "productos", productId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = '<div style="text-align:center; grid-column: 1/-1; padding: 40px;">El repuesto solicitado no existe o fue retirado. <a href="tienda.html" style="color:#385723; font-weight:bold;">Ir a la tienda</a></div>';
                    return;
                }

                const prod = docSnap.data();
                
                // Actualizar miga de pan visual con el nombre real del repuesto
                document.getElementById('breadcrumb-current').textContent = prod.nombre;

                // SEO y Open Graph
                const tituloSEO = `${prod.nombre} | F&B Parts Caracas`;
                const descripcionSEO = `Compra ${prod.nombre} original en Caracas. Precio: $${Number(prod.precio).toFixed(2)}. Envíos a toda Venezuela.`;

                document.title = tituloSEO;
                document.getElementById('seo-desc').content = descripcionSEO;
                document.getElementById('og-title').content = tituloSEO;
                document.getElementById('og-desc').content = descripcionSEO;
                document.getElementById('og-image').content = prod.imagen;
                document.getElementById('og-url').content = window.location.href;

                // 🚀 1. SCHEMA PRODUCT
                const productSchema = {
                    "@context": "https://schema.org/",
                    "@type": "Product",
                    "name": prod.nombre,
                    "image": prod.imagen,
                    "description": prod.descripcion || `Repuesto automotriz ${prod.nombre} disponible en F&B Parts Caracas.`,
                    "sku": prod.numero_parte || productId,
                    "mpn": prod.numero_parte || "",
                    "brand": { "@type": "Brand", "name": "F&B Parts" },
                    "offers": {
                        "@type": "Offer",
                        "url": window.location.href,
                        "priceCurrency": "USD",
                        "price": Number(prod.precio).toFixed(2),
                        "availability": (prod.stock > 0) ? "https://schema.org/InStock" : "https://schema.org/OutOfStock",
                        "seller": { "@type": "Organization", "name": "Inversiones FB Parts, C.A." }
                    }
                };

                const scriptProduct = document.createElement('script');
                scriptProduct.type = "application/ld+json";
                scriptProduct.text = JSON.stringify(productSchema);
                document.head.appendChild(scriptProduct);

                // 🚀 2. SCHEMA BREADCRUMBLIST (Migas de Pan Estructuradas para Google)
                const breadcrumbSchema = {
                    "@context": "https://schema.org",
                    "@type": "BreadcrumbList",
                    "itemListElement": [
                        {
                            "@type": "ListItem",
                            "position": 1,
                            "name": "Inicio",
                            "item": "https://www.fybparts.com/index.html"
                        },
                        {
                            "@type": "ListItem",
                            "position": 2,
                            "name": "Tienda",
                            "item": "https://www.fybparts.com/tienda.html"
                        },
                        {
                            "@type": "ListItem",
                            "position": 3,
                            "name": prod.nombre,
                            "item": window.location.href
                        }
                    ]
                };

                const scriptBreadcrumb = document.createElement('script');
                scriptBreadcrumb.type = "application/ld+json";
                scriptBreadcrumb.text = JSON.stringify(breadcrumbSchema);
                document.head.appendChild(scriptBreadcrumb);

                // Renderizado visual principal
                let botonML = "";
                if(prod.ml_id && prod.ml_id.trim() !== "") {
                    let idML = prod.ml_id.trim();
                    if (idML.startsWith("MLV") && !idML.startsWith("MLV-")) idML = idML.replace("MLV", "MLV-");
                    botonML = `<a href="https://articulo.mercadolibre.com.ve/${idML}" target="_blank" class="btn-ml-large"><i class="fas fa-handshake"></i> Ver esta pieza en Mercado Libre</a>`;
                }

                const safeName = prod.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const stockTxt = prod.stock > 0 ? `<span style="color: #27ae60; font-weight: bold;">En Stock (${prod.stock} disponibles)</span>` : `<span style="color: #c0392b; font-weight: bold;">Agotado</span>`;
                const numParteTxt = prod.numero_parte ? `<p style="margin: 5px 0;"><strong>Número de Parte / OEM:</strong> ${prod.numero_parte}</p>` : '';
                const descTxt = prod.descripcion ? `<p style="margin: 10px 0; color: #666; font-size: 14px; line-height: 1.5;">${prod.descripcion}</p>` : '<p style="margin: 10px 0; color: #888; font-size: 13px;">Sin descripción detallada para este repuesto. Contáctanos para mayor información de compatibilidad.</p>';

                container.innerHTML = `
                    <div class="product-img-box">
                        <img src="${prod.imagen}" alt="Repuesto ${prod.nombre} original en Caracas" onerror="this.src='https://static.wixstatic.com/media/5c1748_5dd249cea38c4c4ba294cdd8edb75b6c~mv2.png/v1/crop/x_0,y_547,w_2395,h_1307/fill/w_135,h_74,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/LOGO-FB-PARTS-COLORES-NUEVOS-_edited_edi.png'">
                    </div>
                    <div class="product-details">
                        <span style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">F&B Parts • Autopartes Originales</span>
                        <h1>${prod.nombre}</h1>
                        <div class="product-price">$${Number(prod.precio).toFixed(2)}</div>
                        
                        <div class="product-meta">
                            <p style="margin: 5px 0;"><strong>Disponibilidad:</strong> ${stockTxt}</p>
                            ${numParteTxt}
                            ${descTxt}
                        </div>

                        <div>
                            <button type="button" class="btn-add-cart-large" onclick="agregarAlCarrito('${productId}', '${safeName}', ${prod.precio})">
                                <i class="fas fa-cart-plus"></i> Añadir al Pedido
                            </button>
                            ${botonML}
                        </div>
                    </div>
                `;

                // Cargar productos relacionados inteligentes
                await cargarProductosRelacionadosPorOEMyNombre(productId, prod.categoria, prod.nombre, prod.numero_parte || "");

            } catch (error) {
                console.error("Error al cargar producto:", error);
                container.innerHTML = '<div style="text-align:center; grid-column: 1/-1; color: red; padding: 40px;">Error al cargar los datos del repuesto.</div>';
            }
        }

        async function cargarProductosRelacionadosPorOEMyNombre(currentId, categoriaActual, nombreActual, numeroParteActual) {
            const relatedGrid = document.getElementById('related-products-grid');
            if (!relatedGrid) return;
            
            try {
                const q = query(collection(db, "productos"), where("estado", "==", "activo"), limit(35));
                const snap = await getDocs(q);
                
                let poolProductos = [];
                snap.forEach(docSnap => {
                    if (docSnap.id !== currentId) {
                        poolProductos.push({ id: docSnap.id, ...docSnap.data() });
                    }
                });

                const palabrasIgnoradas = ["de", "para", "el", "la", "los", "las", "y", "con", "en", "un", "una", "del", "al"];
                const palabrasNombre = nombreActual.toLowerCase().replace(/[^a-záéíóúñ0-9]/g, " ").split(/\s+/).filter(w => w.length > 2 && !palabrasIgnoradas.includes(w));
                const tokensOEM = numeroParteActual ? numeroParteActual.toLowerCase().replace(/[^a-záéíóúñ0-9]/g, " ").split(/\s+/).filter(w => w.length > 1 && !palabrasIgnoradas.includes(w)) : [];

                let puntuados = poolProductos.map(prod => {
                    let score = 0;
                    const nombreProd = prod.nombre.toLowerCase();
                    const oemProd = prod.numero_parte ? prod.numero_parte.toLowerCase() : "";

                    if (prod.categoria === categoriaActual) score += 5;
                    palabrasNombre.forEach(palabra => { if (nombreProd.includes(palabra)) score += 10; });
                    tokensOEM.forEach(token => { if (oemProd.includes(token) || nombreProd.includes(token)) score += 30; });

                    return { producto: prod, score: score };
                });

                puntuados.sort((a, b) => b.score - a.score);
                let seleccionados = puntuados.map(item => item.producto).slice(0, 4);

                if (seleccionados.length < 4) {
                    const idsSeleccionados = new Set(seleccionados.map(p => p.id));
                    for (let p of poolProductos) {
                        if (!idsSeleccionados.has(p.id) && seleccionados.length < 4) seleccionados.push(p);
                    }
                }

                if (seleccionados.length === 0) {
                    relatedGrid.innerHTML = '<p style="text-align:center; color:#666; grid-column: 1/-1;">No hay otros repuestos disponibles por el momento.</p>';
                    return;
                }
                
                relatedGrid.innerHTML = '';
                seleccionados.forEach(prod => {
                    const slug = prod.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '-').replace(/(^-|-$)/g, '');
                    const productUrl = `producto.html?id=${prod.id}&pieza=${slug}`;
                    
                    relatedGrid.innerHTML += `
                        <div style="background: white; border: 1px solid #eee; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,.05); display: flex; flex-direction: column; transition: transform 0.2s;">
                            <a href="${productUrl}" style="text-decoration: none; color: inherit; display: contents;">
                                <div style="width: 100%; height: 160px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                    <img src="${prod.imagen}" alt="Repuesto ${prod.nombre} en Caracas" loading="lazy" style="width: 100%; height: 100%; object-fit: contain;">
                                </div>
                                <div style="padding: 12px; display: flex; flex-direction: column; flex: 1;">
                                    <h4 style="font-size: 13px; color: #333; margin: 0 0 8px 0; font-weight: bold; flex: 1; line-height: 1.3;">${prod.nombre}</h4>
                            </a>
                                    <div style="font-size: 16px; color: #385723; font-weight: bold; font-family: 'Oswald', sans-serif; margin-bottom: 10px;">$${Number(prod.precio).toFixed(2)}</div>
                                    <div style="margin-top: auto;">
                                        <button type="button" onclick="window.location.href='${productUrl}'" style="background: #385723; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 12px; transition: 0.2s;"><i class="fas fa-eye"></i> Ver Detalles</button>
                                    </div>
                                </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error cargando relacionados:", e);
                relatedGrid.innerHTML = '';
            }
        }

        window.agregarAlCarrito = function(id, nombre, precio) {
            let carrito = JSON.parse(localStorage.getItem('carritoFB')) || [];
            const item = carrito.find(i => i.id === id);
            if(item) item.cantidad++;
            else carrito.push({ id, nombre, precio, cantidad: 1 });
            localStorage.setItem('carritoFB', JSON.stringify(carrito));
            alert("¡Repuesto añadido a tu pedido!");
        };

        window.addEventListener('DOMContentLoaded', cargarDetalleProducto);
    </script>
</body>
</html>
